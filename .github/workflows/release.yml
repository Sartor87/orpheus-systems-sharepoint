# Tag v* -> run the full pipeline, then attach the four .sppkg files to a GitHub Release.
# Nothing is deployed to any tenant.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sppkg
          path: sppkg

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t files < <(find sppkg -name '*.sppkg' | sort)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::expected 4 .sppkg files, found ${#files[@]}"
            exit 1
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" "${files[@]}" --verify-tag --generate-notes --title "$TAG" "${prerelease[@]}"
