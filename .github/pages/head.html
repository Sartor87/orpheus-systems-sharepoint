<style>
  :root { --ink: #1b1f24; --muted: #5b6470; --bg: #f6f7f9; --card: #ffffff; --line: #e2e5ea; --dark: #0b0d10; --amber: #e0a83a; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6; }
  header.site { background: var(--dark); color: #fff; padding: 0.9rem 1.5rem; border-bottom: 3px solid var(--amber); display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
  header.site a { color: #fff; text-decoration: none; }
  header.site .brand { font-weight: 700; }
  header.site .brand span { color: var(--amber); }
  header.site nav a { color: #cfd4da; margin-right: 1rem; font-size: 0.95rem; }
  header.site nav a:hover { color: var(--amber); }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  h1, h2, h3 { line-height: 1.25; }
  h1 { border-bottom: 2px solid var(--amber); padding-bottom: 0.4rem; }
  a { color: #8a5a00; }
  code { background: #eef0f3; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.9em; }
  pre code { display: block; padding: 0.9rem; overflow-x: auto; }
  pre.mermaid { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; text-align: center; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; }
  th { background: #eef0f3; }
  img { max-width: 100%; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.25rem; margin: 1rem 0; }
  .muted { color: var(--muted); font-size: 0.92rem; }
  ul.list { list-style: none; padding: 0; }
  ul.list li { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 0.6rem 0.9rem; margin: 0.35rem 0; }
  .status { font-size: 0.8rem; padding: 0.1rem 0.5rem; border-radius: 999px; margin-left: 0.4rem; background: #eef0f3; }
  .status.Accepted { background: #e3f4e8; color: #1e6b37; }
  .status.Proposed { background: #fff2d9; color: #8a5a00; }
  footer.site { color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--line); margin-top: 3rem; padding-top: 1rem; }
</style>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: true, theme: 'default', securityLevel: 'strict', flowchart: { useMaxWidth: true } });
</script>
