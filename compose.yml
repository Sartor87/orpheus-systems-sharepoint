x-spfx: &spfx
  image: docker.io/m365pnp/spfx:1.23.2
  working_dir: /usr/app/spfx
  # Run as the bind mount's owner (uid 1000 = `node` in the image). The Windows
  # drvfs/9p mount refuses chmod/fchmod from any other uid, which breaks
  # fs.copyFile (Heft copy steps). Run `fix-perms` once after creating volumes.
  user: "1000:1000"
  volumes:
    - .:/usr/app/spfx
    - npm-cache:/home/spfx/.npm
    - rushstack:/home/spfx/.rushstack
    - nm-root:/usr/app/spfx/node_modules
    - nm-shared-core:/usr/app/spfx/packages/shared-core/node_modules
    - nm-shared-ui:/usr/app/spfx/packages/shared-ui/node_modules
    - nm-wp-contract-calendar:/usr/app/spfx/packages/wp-contract-calendar/node_modules
    - nm-ext-app-customizer:/usr/app/spfx/packages/ext-app-customizer/node_modules
    - nm-ext-field-customizer:/usr/app/spfx/packages/ext-field-customizer/node_modules
    - nm-ext-form-customizer:/usr/app/spfx/packages/ext-form-customizer/node_modules
    - nm-mcp-contract-calendar:/usr/app/spfx/packages/mcp-contract-calendar/node_modules
  environment:
    - "HOME=/home/spfx"
    - "npm_config_cache=/home/spfx/.npm"

services:
  fix-perms:
    <<: *spfx
    user: "0:0"
    command: >-
      chown -R 1000:1000
      /home/spfx/.npm
      /home/spfx/.rushstack
      /usr/app/spfx/node_modules
      /usr/app/spfx/packages/shared-core/node_modules
      /usr/app/spfx/packages/shared-ui/node_modules
      /usr/app/spfx/packages/wp-contract-calendar/node_modules
      /usr/app/spfx/packages/ext-app-customizer/node_modules
      /usr/app/spfx/packages/ext-field-customizer/node_modules
      /usr/app/spfx/packages/ext-form-customizer/node_modules
      /usr/app/spfx/packages/mcp-contract-calendar/node_modules
  shell:
    <<: *spfx
    command: bash
    stdin_open: true
    tty: true
  install:
    <<: *spfx
    command: npm ci
  build:
    <<: *spfx
    command: npm run build
  test:
    <<: *spfx
    command: npm run test:shared
  serve:
    <<: *spfx
    command: bash -c "npm run serve -w ${PKG:-@orpheussystems/wp-contract-calendar}"
    ports:
      - "4321:4321"
      - "35729:35729"
  mcp:
    <<: *spfx
    command: npm run start -w @orpheussystems/mcp-contract-calendar
    env_file:
      - path: packages/mcp-contract-calendar/.env
        required: false
    ports:
      - "8787:8787"
  package:
    <<: *spfx
    command: npm run package

volumes:
  npm-cache:
  rushstack:
  nm-root:
  nm-shared-core:
  nm-shared-ui:
  nm-wp-contract-calendar:
  nm-ext-app-customizer:
  nm-ext-field-customizer:
  nm-ext-form-customizer:
  nm-mcp-contract-calendar:
